<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AFT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="Logo/AFT.svg" />
  <link rel="stylesheet" href="Styles/Style.css" />

<script>
function toggleMenu() {
  const menu = document.getElementById("mobileMenu");
  menu.style.display = 
    menu.style.display === "block" ? "none" : "block";
}
</script>

  <script src="Controls/Control.js" defer></script>

<body lang="ar" dir="rtl">

  <!-- Header Embed -->
  <iframe class="layout-frame layout-frame-header" src="basics/header.html" title="رأس الصفحة" loading="lazy"></iframe>

  <!-- Basmala -->
  <div class="basmala">
    بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ
  </div>

<!-- Services Section -->
<main>
  <h2 class="section-title">خدماتنا الشاملة</h2>

  <section class="services">
    <a href="basics/services.html" class="more-services" target="_blank">اضغط هنا للمزيد من الخدمات والتفاصيل</a>

    <!-- 1. قسم صيانة وتطوير الكمبيوتر واللابتوب (Hardware) -->
    <div class="service-category">
      <h3>💻 صيانة وترقية الكمبيوتر واللابتوب (Hardware)</h3>
      <div class="services-grid">
        <button type="button">💽 ترقية وتغيير وحدات التخزين (HDD - SSD Sata - M.2 NVMe)</button>
        <button type="button">🧠 تركيب وتوفير رامات جميع الأجيال (DDR1 / DDR2 / DDR3 / DDR4 / DDR5 / DDR6)</button>
        <button type="button">🎮 صيانة وترقية كروت الشاشة (Nvidia RTX / GTX & AMD Radeon)</button>
        <button type="button">🖥️ صيانة ومعاملة خاصة لكيسات الجيمينج (Gaming PCs) والتجميعات العالية</button>
        <button type="button">❄️ تنظيم الكابلات (Cable Management) وتنظيف التراب وتغيير المعجون الحراري</button>
      </div>
    </div>

    <!-- 2. قسم الدعم البرمجي والسوفت وير (Software & Remote Support) -->
    <div class="service-category">
      <h3>🖥️ السوفت وير والدعم الفني عن بُعد</h3>
      <div class="services-grid">
        <button type="button">🪟 تثبيت أنظمة الويندوز والتعريفات الأصلية حل مشاكل الـ BSOD</button>
        <button type="button">🌐 دعم فني وحل المشاكل البرمجية عن بُعد (Remote Assistance)</button>
        <button type="button">📊 تصميم وإعداد شيتات الكنترول وإكسيل البيانات المعقدة (Excel / Sheets)</button>
        <button type="button">🎮 تنزيل وتحديث أحدث الألعاب وقسم طلب الألعاب والبرامج الخاصة</button>
      </div>
    </div>

    <!-- 3. قسم الشبكات والأمن السيبراني (Networks & Cyber Security) -->
    <div class="service-category">
      <h3>🌐 الشبكات والأمن السيبراني</h3>
      <div class="services-grid">
        <button type="button">🛡️ ضبط الراوتر وإعداد شبكة منزلية/مكتبية آمنة لحماية العائلة من المواقع الضارة</button>
        <button type="button">🔒 اختبار اختراق الواي فاي والشبكات لتقييم الثغرات والحماية (Pentesting)</button>
        <button type="button" class="disabled" title="قريباً">📡 إعداد وتصفيح شبكات السايبر والتثبيت على Packet Tracer (Cisco CCNA - قريباً ⏳)</button>
      </div>
    </div>

    <!-- 4. قسم الهندسة وتصميم الإلكترونيات (PCB & Mechatronic) -->
    <div class="service-category">
      <h3>⚙️ الهندسة الإلكترونية والميكاترونكس</h3>
      <div class="services-grid">
        <button type="button">📐 الرسم الهندسي والتصميم الميكانيكي 2D / 3D CAD</button>
        <button type="button">🔌 تصميم واختبار وطباعة الدوائر الإلكترونية المطبوعة (PCB Design & Fabrication)</button>
        <button type="button">🤖 تنفيذ وتجميع مشاريع التخرج والميكاترونكس والأنظمة المدمجة</button>
        <button type="button">🖨️ خدمات الطباعة ثلاثية الأبعاد (3D Printing)</button>
      </div>
    </div>

    <!-- 5. قسم تجهيز وسائل النقل وتعديل الطاقة -->
    <div class="service-category">
      <h3>🚲 🏍️ 🚗 ترويق وتعديل المركبات والطاقة</h3>
      <div class="services-grid">
        <button type="button">🔋 باور بنك شمسي وأنظمة شحن الطاقة المستدامة</button>
        <button type="button">🛠️ لحامات إلكترونية دقيقة وتعديل الدوائر</button>
        <button type="button">🚲 ترويق العجل (أنوار + كلاكس + دينامو + سماعات + شحن طاقة شمسية)</button>
        <button type="button">🏍️ ترويق المكن (أنوار + كلاكس + دينامو + سماعات + شحن طاقة شمسية)</button>
        <button type="button">🚗 ترويق العربيات (أنوار + كلاكس + دينامو + سماعات + شحن طاقة شمسية)</button>
      </div>
    </div>

  </section>
</main>


  <!-- Footer Embed -->

  <embed src="basics/footer.html" width="100%" height="230px" style="border:0;" aria-label="تذييل الصفحة" />


</body>
</html>

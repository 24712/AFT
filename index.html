<!-- Services Section -->
<main>
  <h2 class="section-title">خدماتنا</h2>

  <section class="services">
    <a href="basics/services.html" class="more-services" target="_blank">اضغط هنا للمزيد من الخدمات</a>
    
    <!-- قسم صيانة الكمبيوتر واللابتوب -->
    <div class="service-category">
      <h3>💻 صيانة الكمبيوتر واللابتوب (Hardware & Software)</h3>
      <div class="services-grid">
        <button type="button">🛠️ صيانة شاملة (هاردوير وسوفت وير)</button>
        <button type="button">❄️ تنظيف التراب وتغيير المعجون الحراري (Thermal Paste) للمعالج وكارت الشاشة</button>
        <button type="button">🎛️ ترقية وتغيير كروت الشاشة والرامات والهاردات (SSD / HDD)</button>
        <button type="button">🪟 تثبيت وتحديث أنظمة الويندوز (Windows) وتفعيلها</button>
        <button type="button">📦 تثبيت وتفعيل البرامج الأساسية والاحترافية (حسب الطلب)</button>
        <button type="button">🖥️ إعداد وتوفير سيرفرات RDP / RDS للعمل عن بُعد</button>
        <button type="button">🎮 تنزيل وتحديث أحدث الألعاب وقسم طلب الألعاب الخاصة</button>
      </div>
    </div>

    <!-- قسم الشبكات والسايبر -->
    <div class="service-category">
      <h3>🌐 شبكات وسيرفرات (قريباً ⏳)</h3>
      <div class="services-grid">
        <button type="button">📡 إنشاء وتأسيس شبكات السايبر والمكاتب (Cyber Cafe Networks)</button>
        <button type="button" class="disabled" title="قريباً">🔒 إعداد السيرفرات وإدارة حظر واستهلاك الإنترنت (قريباً)</button>
      </div>
    </div>

    <!-- قسم الميكاترونكس والابتكارات الهندسية -->
    <div class="service-category">
      <h3>⚙️ المشاريع الهندسية والابتكارات</h3>
      <div class="services-grid">
        <button type="button">🤖 تنفيذ وطلب المشاريع الهندسية لمشاريع التخرج والميكاترونكس</button>
        <button type="button">🖨️ طباعة 3D وتصميم النماذج ثلاثية الأبعاد</button>
        <button type="button">🔋 بور بنك شمسي وأنظمة شحن الطاقة المستدامة</button>
        <button type="button">🛠️ لحامات وتجميع الدوائر الإلكترونية Precision Soldering</button>
      </div>
    </div>

    <!-- قسم تجهيز وتعديل وسائل النقل -->
    <div class="service-category">
      <h3>🚲 🏍️ 🚗 ترويق وتعديل وسائل النقل</h3>
      <div class="services-grid">
        <button type="button">🚲 ترويق العجل (أنوار + كلاكس + دينامو + سماعات + شحن طاقة شمسية)</button>
        <button type="button">🏍️ ترويق المكن (أنوار + كلاكس + دينامو + سماعات + شحن طاقة شمسية)</button>
        <button type="button">🚗 ترويق العربيات (أنوار + كلاكس + دينامو + سماعات + شحن طاقة شمسية)</button>
        <button type="button">🔌 تعديل الأجهزة الإلكترونية لتدعم الشحن</button>
      </div>
    </div>

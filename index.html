<!-- Services Section -->
<main>
  <h2 class="section-title">خدماتنا</h2>

  <section class="services">
    <a href="basics/services.html" class="more-services" target="_blank">اضغط هنا للمزيد من الخدمات</a>

    <!-- 1. قسم الكمبيوتر والهاردوير -->
    <div class="service-category">
      <h3>💻 صيانة وتطوير الكمبيوتر واللابتوب (Hardware)</h3>
      <ul>
        <li><button type="button">💽 تركيب وتغيير ونقل بيانات الهاردات (HDD كمبيوتر ولابتوب / SSD / SSD M.2 / NVMe)</button></li>
        <li><button type="button">🧠 توفير وترقية رامات كمبيوتر ولابتوب (DDR1 / DDR2 / DDR3 / DDR4 / DDR5 / DDR6)</button></li>
        <li><button type="button">🎮 صيانة وتغيير كروت الشاشة (RTX / GTX / AMD Radeon)</button></li>
        <li><button type="button">🛠️ تنظيف التراب، تنظيم الكابلات، وتغيير المعجون الحراري للمعالج وكارت الشاشة</button></li>
        <li><button type="button">🖥️ معاملة وصيانة خاصة لكيسات الجيمينج والتجميعات العالية (Gaming PCs)</button></li>
        <li><button type="button">🔧 صيانة مفصلات وشاشات اللابتوب وشحن البيوس (BIOS)</button></li>
      </ul>
    </div>

    <!-- 2. قسم السوفت وير والدعم الفني -->
    <div class="service-category">
      <h3>🖥️ السوفت وير والدعم الفني</h3>
      <ul>
        <li><button type="button">🪟 تنزيل ويندوز وتثبيت التعريفات والبرامج الأساسية والاحترافية</button></li>
        <li><button type="button">🎮 تنزيل وتحديث الألعاب + قسم خاص لطلب برامج أو ألعاب معينة</button></li>
        <li><button type="button">🛠️ حل مشاكل الكمبيوتر والشتات برمجياً وعن بعد (Remote Support)</button></li>
        <li><button type="button">📊 تصميم وإعداد شيتات الكنترول والإكسيل المعقدة</button></li>
        <li><button type="button">🌐 توفير وإعداد سيرفرات RDP / RDS للرفع والتصفح السريع عن بعد</button></li>
        <li><button type="button">💾 استرجاع البيانات والملفات المفقودة (Data Recovery)</button></li>
      </ul>
    </div>

    <!-- 3. قسم الشبكات والأمن السيبراني -->
    <div class="service-category">
      <h3>🌐 الشبكات والأمن السيبراني</h3>
      <ul>
        <li><button type="button">🛡️ تعديل إعدادات الراوتر، وضع فلتر حماية العائلة من المواقع الضارة، وتأمين الشبكة</button></li>
        <li><button type="button">🔒 اختبار اختراق الواي فاي والشبكات وتقييم الثغرات (Pentesting)</button></li>
        <li><button type="button">📡 إنشاء وتأسيس شبكات السايبر والمكاتب وتقسيم السرعات</button></li>
        <li><button type="button">⏳ تطبيق واختبار شبكات Cisco CCNA على Packet Tracer (قريباً)</button></li>
      </ul>
    </div>

    <!-- 4. قسم الهندسة والـ PCB والطباعة 3D -->
    <div class="service-category">
      <h3>⚙️ الإلكترونيات والميكاترونكس</h3>
      <ul>
        <li><button type="button">🔌 تصميم وإنشاء بوردات الدوائر المطبوعة (PCB Design & Fabrication)</button></li>
        <li><button type="button">🤖 طلب ومساعدة في تنفيذ مشاريع الهندسة والميكاترونكس ومشاريع التخرج</button></li>
        <li><button type="button">📐 رسم وتصميم هندسي (2D / 3D CAD Drawing)</button></li>
        <li><button type="button">🖨️ طباعة 3D وتجسيم النماذج</button></li>
        <li><button type="button">🛠️ لحامات إلكترونية دقيقة وتجميع الدوائر</button></li>
      </ul>
    </div>

    <!-- 5. قسم وسائل النقل والأجهزة الإلكترونية -->
    <div class="service-category">
      <h3>🚲 🏍️ 🚗 تعديل وسائل النقل والطاقة</h3>
      <ul>
        <li><button type="button">🚲 روق عجلتك بأنوار وكلاكس ودينامو وسماعات وشحن طاقة شمسية</button></li>
        <li><button type="button">🏍️ روق مَكَنِتَكْ بأنوار وكلاكس ودينامو وسماعات وشحن طاقة شمسية</button></li>
        <li><button type="button">🚗 روق عربيتك بأنوار وكلاكس ودينامو وسماعات وشحن طاقة شمسية</button></li>
        <li><button type="button">🔌 جعل الأجهزة الإلكترونية تدعم الشحن</button></li>
        <li><button type="button">🔋 بور بنك شمسي وتجميع بطاريات الليثيوم</button></li>
      </ul>
    </div>

  </section>
